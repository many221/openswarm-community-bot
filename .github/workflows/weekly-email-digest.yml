name: Weekly email digest

on:
  schedule:
    # 16:00 UTC Wednesday = 8:00am PT during PST (winter)
    # During PDT (summer) this fires at 9:00am PT; adjust if needed.
    - cron: '0 16 * * 3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render only and upload the artifact, skip the approval gate and send'
        type: boolean
        default: false
      feedback:
        description: 'Optional reviewer feedback to apply on re-render (e.g. "shorter greeting, mention Pixelpus, drop the spotlight")'
        type: string
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install anthropic==0.* requests jinja2

      - name: Render the email
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: render
          FEEDBACK: ${{ inputs.feedback }}
        run: python scripts/weekly_digest.py

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: |
            digest_preview.html
            digest_meta.json
          if-no-files-found: error

  send:
    needs: prepare
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    environment: email-send
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Download approved render
        uses: actions/download-artifact@v4
        with:
          name: digest-${{ github.run_id }}

      - name: Send via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          MODE: send
        run: python scripts/weekly_digest.py
